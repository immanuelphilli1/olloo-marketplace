  /v1/browsing-history:
    post:
      operationId: postBrowsingHistory
      tags: [Account]
      summary: Record a product view
      description: Authenticated or guest (guest identified by X-Cart-Id or cart cookie; 401 guest_token_required without one).
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, description: Product rid. Call when a product detail page opens. }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [success, rid, productId]
                properties:
                  success: { type: boolean, example: true }
                  rid: { type: string }
                  productId: { type: string }
        '401':
          description: guest_token_required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: product_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    get:
      operationId: getBrowsingHistory
      tags: [Account]
      summary: Date-grouped history
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Non-empty sections only (today, yesterday, older).
          content:
            application/json:
              schema:
                type: object
                required: [sections]
                properties:
                  sections:
                    type: array
                    items:
                      type: object
                      required: [id, label, items]
                      properties:
                        id:
                          type: string
                          enum: [today, yesterday, older]
                          description: Bucket key, not a resource identifier.
                        label: { type: string }
                        items:
                          type: array
                          items:
                            type: object
                            required: [rid, viewedAt, product]
                            properties:
                              rid: { type: string }
                              viewedAt: { type: string, format: date-time }
                              product: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      operationId: deleteBrowsingHistory
      tags: [Account]
      summary: Delete history entries
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: History entry rids.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
