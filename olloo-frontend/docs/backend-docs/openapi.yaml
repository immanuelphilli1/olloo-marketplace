              properties:
                email: { type: string, format: email, maxLength: 255 }
                name: { type: string, maxLength: 120 }
                company: { type: string, maxLength: 160 }
                phone: { type: string, maxLength: 40 }
                message: { type: string, maxLength: 5000 }
                productIds:
                  type: array
                  items: { type: string }
                  description: Product rids of interest (stored, not validated).
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [success, rid, type]
                properties:
                  success: { type: boolean, example: true }
                  rid: { type: string }
                  type: { type: string, example: quotation }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/support/agent-requests:
    post:
      operationId: postSupportAgentRequests
      tags: [Content]
      summary: Request an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email, maxLength: 255 }
                name: { type: string, maxLength: 120 }
                phone: { type: string, maxLength: 40 }
                message: { type: string, maxLength: 5000 }
                orderId: { type: string, maxLength: 80, description: Order rid if related (not verified). }
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [success, rid, type]
                properties:
                  success: { type: boolean, example: true }
                  rid: { type: string }
                  type: { type: string, example: agent }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks/{provider}:
    post:
      operationId: postWebhooksProvider
      tags: [Webhooks]
      summary: Provider webhook (server-to-server)
      description: Never called by clients. Never send X-Cart-Id, bearer tokens, or staff session here; resolution is by payment rid or provider reference in the payload, verified via the provider API before marking paid, stored idempotently by (provider, external_event_id).
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
          description: stripe | paystack | fake | paypal | tabby | tamara.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Provider-specific event payload.
      responses:
        '200':
          description: Ingested (processing continues async; paid state appears via GET /payments/{payment}).
          content:
            application/json:
              schema:
                type: object
                required: [received, provider, externalEventId]
                properties:
                  received: { type: boolean, example: true }
                  provider: { type: string }
                  externalEventId: { type: string }
        '400':
          description: webhook_ingest_failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: invalid_provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum access token from login, register, OAuth, or refresh.
  parameters:
    CartId:
      name: X-Cart-Id
      in: header
      schema: { type: string }
      description: Guest cart rid. Ignored once authenticated except merge and order placement (which consume it). Responses return it as a header and cart_id cookie.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: 'UUID per user action, reused across retries. Missing gives 428; replay returns the first response with Idempotent-Replayed: true; a reused key with a different body gives 422 idempotency_key_reused.'
    Country:
      name: country
      in: query
      schema: { type: string }
      description: Destination as ISO code, country rid, or name. Drives delivery quotes and tax; defaults to the signed-in default address. Unknown values give 422 country_not_found.
    Depth:
      name: depth
      in: query
      schema: { type: integer, minimum: 0, maximum: 10 }
      description: Child nesting depth; 0 means no children, omitted means the full tree.
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1, minimum: 1 }
    Limit100:
      name: limit
      in: query
      schema: { type: integer, default: 24, minimum: 1, maximum: 100 }
  responses:
    Unauthorized:
      description: Unauthenticated (api_error envelope, code unauthenticated).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validation failure (422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: 'Stable machine code (e.g. price_changed, currency_mismatch). Branch on this, never on message text.'}
            message: { type: string, description: 'Human sentence; not translated, do not display verbatim in localized UI.'}
            details:
              type: object
              description: >-
                Optional machine payload; the shape depends on code. Known shapes
                are formalised below (ValidationFieldErrors, CartItemIds,
                PriceChangedDetails, StockShortfall, VariantStockShortfall,
                PaymentMethodUnavailable, ReturnEligibility, OrderNotPayable).
                Codes without a documented shape send no details. Any code may
                add keys later; treat unknown keys as forward-compatible and
                ignore them.
      x-error-codes:
        - code: validation_error
          status: 422
          details: ValidationFieldErrors
          note: Field name to list of messages; the field names are the request body keys.
        - code: price_changed
          status: 409
          details: PriceChangedDetails
          note: 'Prices were already acknowledged server-side; show the new prices and order again with a fresh Idempotency-Key.'
        - code: currency_mismatch
          status: 409
          details: CartItemIds
          note: The listed cart lines are priced in another currency; remove them.
        - code: item_unavailable
          status: 409
          details: CartItemIds
          note: The listed cart lines are inactive, unbuyable, or their variant is gone.
        - code: insufficient_stock
          status: [409, 422]
          details: StockShortfall or VariantStockShortfall
          note: Adding one line gives VariantStockShortfall; placing an order gives StockShortfall with every short line.
        - code: payment_method_not_found
          status: 404
          note: Unknown method rid or code.
        - code: payment_method_unavailable
          status: 422
          details: PaymentMethodUnavailable
          note: The method exists but is not enabled for that currency or destination.
        - code: order_not_payable
          status: 409
          details: OrderNotPayable
          note: Order already cancelled, shipped, or otherwise past payment.
        - code: order_already_paid
          status: 409
          note: Payment already settled; do not retry.
        - code: return_not_allowed
          status: 422
          details: ReturnEligibility
          note: Also returned when the order has not shipped yet, with no details.
        - code: return_already_open
          status: 422
          note: One open return per order.
        - code: idempotency_key_required
          status: 428
          note: POST /v1/orders and POST /v1/checkout/payment-intent only; send a new UUID per attempt and reuse it on retries.
        - code: idempotency_key_reused
          status: 422
          note: Same key with a different body; generate a new key.
        - code: idempotency_in_progress
          status: 409
          note: Retry shortly with the same key.
        - code: unauthenticated
          status: 401
        - code: not_found
          status: 404
          note: Framework 404. Inactive catalog rows also return a plain 404 body outside this envelope.
    ValidationFieldErrors:
      type: object
      description: validation_error details; field name to messages.
      additionalProperties:
        type: array
        items: { type: string }
      example:
        quantity: ['The quantity must be at least 1.']
    CartItemIds:
      type: object
      required: [cartItemIds]
      properties:
        cartItemIds:
          type: array
          items: { type: string }
          description: Cart line rids the client must remove or update.
    # Per-code error schemas. Each pins `code` so a client can match on it and
    # carries the `details` shape for that code. Responses that can emit several
    # codes list them as oneOf.
    ErrorValidation:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [validation_error] }
                details: { $ref: '#/components/schemas/ValidationFieldErrors' }
    ErrorInvalidQuantity:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [invalid_quantity] }
    ErrorCurrencyMismatch:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [currency_mismatch] }
                details: { $ref: '#/components/schemas/CartItemIds' }
    ErrorItemUnavailable:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [item_unavailable] }
                details: { $ref: '#/components/schemas/CartItemIds' }
    ErrorInsufficientStock:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [insufficient_stock] }
                details:
                  oneOf:
                    - $ref: '#/components/schemas/VariantStockShortfall'
                    - $ref: '#/components/schemas/StockShortfall'
    ErrorPriceChanged:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [price_changed] }
                details: { $ref: '#/components/schemas/PriceChangedDetails' }
    ErrorCartChanged:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [cart_changed] }
    ErrorPaymentMethodUnavailable:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [payment_method_unavailable] }
                details: { $ref: '#/components/schemas/PaymentMethodUnavailable' }
    ErrorOrderNotPayable:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [order_not_payable] }
                details: { $ref: '#/components/schemas/OrderNotPayable' }
    ErrorOrderAlreadyPaid:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [order_already_paid] }
    ErrorReturnNotAllowed:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [return_not_allowed] }
                details: { $ref: '#/components/schemas/ReturnEligibility' }
    ErrorReturnAlreadyOpen:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [return_already_open] }
    ErrorIdempotencyKeyReused:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [idempotency_key_reused] }
    ErrorIdempotencyKeyRequired:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            error:
              type: object
              properties:
                code: { type: string, enum: [idempotency_key_required] }
    PriceChangedDetails:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [cartItemId, previousPrice, price]
            properties:
              cartItemId: { type: string }
              previousPrice:
                allOf: [{ $ref: '#/components/schemas/Money' }]
                description: What the shopper last saw.
              price:
                allOf: [{ $ref: '#/components/schemas/Money' }]
                description: Current price; becomes the new previousPrice.
    StockShortfall:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [variantRid, requested, available]
            properties:
              variantRid: { type: string }
              requested: { type: integer }
              available:
                type: integer
                nullable: true
                description: Units left; null when the variant is not stock-tracked.
    VariantStockShortfall:
      type: object
      required: [variantRid, available]
      properties:
        variantRid: { type: string }
        available:
          type: integer
          nullable: true
          description: Units left; null when the variant is not stock-tracked.
    PaymentMethodUnavailable:
      type: object
      required: [paymentMethodId, currency]
      properties:
        paymentMethodId: { type: string }
        currency: { type: string }
    ReturnEligibility:
      type: object
      required: [eligible]
      properties:
        eligible: { type: boolean }
        reason: { type: string, nullable: true }
        windowDays: { type: integer, nullable: true }
        deadline: { type: string, format: date-time, nullable: true }
    OrderNotPayable:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending_payment, processing, shipped, delivered, cancelled] }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, description: Major units (e.g. 179 for AED 179.00). Format client-side; never parse display strings. }
        currency: { type: string, example: AED }
    FrozenDeliveryWording:
      type: string
      nullable: true
      description: >-
        Free-text delivery wording frozen onto the order when it was placed
        (for example "Estimated delivery: 3-5 business days"), and the only
        value for past orders where the window has already elapsed. Display it
        as-is and never parse it. Current, machine-readable days for a fresh
        quote are `shipping.deliveryDays` ({ min, max }) on the order detail and
        the checkout endpoints; for listing-level days use `deliveryQuote`.
    AuthUser:
      type: object
      required: [rid, displayName, fullName, email]
      properties:
        rid: { type: string }
        displayName: { type: string }
        fullName: { type: string }
        email: { type: string }
    AuthTokens:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user: { $ref: '#/components/schemas/AuthUser' }
        accessToken: { type: string, description: Bearer token for Authorization header. }
        refreshToken: { type: string, description: Single-use; rotation revokes the old pair. }
    UserProfile:
      type: object
      required: [fullName, email, initials, displayName, phone, rid]
      properties:
        fullName: { type: string }
        email: { type: string }
        initials: { type: string }
        displayName: { type: string }
        phone: { type: string, nullable: true }
        rid: { type: string }
    CategoryNode:
      type: object
      required: [rid, label, image, imageUrl, children]
      properties:
        rid: { type: string }
        label: { type: string }
        image: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true, description: Absolute URL from app.url. }
        children:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }
    CategoryPanel:
      allOf:
        - $ref: '#/components/schemas/CategoryNode'
        - type: object
          required: [parent, sections]
          properties:
            parent:
              type: object
              nullable: true
              required: [rid, slug, label]
              properties:
                rid: { type: string }
                slug: { type: string }
                label: { type: string }
            sections:
              type: array
              description: sections[0] mirrors children.
              items:
                type: object
                required: [title, children]
                properties:
                  title: { type: string }
                  children:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryNode' }
    ProductCard:
      type: object
      required: [rid, categoryId, subcategory, image, imageUrl, tags, category, name, priceMoney, taxRatePercent, discountPercent, deliveryQuote, ratingValue, reviewCount, soldCount, inStock, brand, color, screenSize, attributes]
      properties:
        rid: { type: string }
        categoryId: { type: string, description: Category slug (fallback rid). }
        subcategory: { type: string, description: 'Parent category label, else empty.'}
        image: { type: string }
        imageUrl: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
          description: In display order; tags[0] is the storefront badge.
        category: { type: string, description: Category label. }
        name: { type: string }
        priceMoney: { $ref: '#/components/schemas/Money' }
        priceInclTaxMoney:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'Price plus destination tax; null without a destination. Prices are tax-exclusive: show this where consumer prices must include VAT.'
        taxRatePercent: { type: number, nullable: true, description: Combined destination rate; null without a destination. }
        originalPriceMoney:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        discountPercent: { type: integer, nullable: true }
        deliveryQuote:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/DeliveryQuote' }]
        ratingValue: { type: number, description: Derived from approved reviews only; 0 with none. }
        reviewCount: { type: integer }
        soldCount: { type: integer, description: 'Paid, non-cancelled orders.'}
        liked: { type: boolean, nullable: true, description: True when wishlisted; null for guests. }
        inStock: { type: boolean, description: Default variant can supply 1 unit (untracked counts as in stock). }
        brand: { type: string, nullable: true }
        color: { type: string, nullable: true }
        screenSize: { type: string, nullable: true }
        attributes:
          type: array
          description: Every attribute with display label, in category order.
          items:
            type: object
            required: [key, label, value]
            properties:
              key: { type: string }
              label: { type: string }
              value: { type: string }
    DeliveryQuote:
      type: object
      required: [free, fee, minDays, maxDays]
      properties:
        free: { type: boolean }
        fee: { $ref: '#/components/schemas/Money' }
        minDays: { type: integer }
        maxDays: { type: integer }
    ProductDetail:
      type: object
      required: [product, images, imageUrls, ratingValue, reviewCount, soldCount, priceMoney, priceCurrency, discountNotice, modelOptions, variantOptions, variants, descriptionLines, shippingFeeMoney, deliveryDays]
      properties:
        product: { $ref: '#/components/schemas/ProductCard' }
        images: { type: array, items: { type: string }, description: Relative paths; cover first. }
        imageUrls: { type: array, items: { type: string }, description: Absolute equivalents. }
        ratingValue: { type: number }
        reviewCount: { type: integer }
        soldCount: { type: integer }
        priceMoney: { $ref: '#/components/schemas/Money' }
        priceCurrency: { type: string }
        discountNotice: { type: string, nullable: true, description: Staff-written sale note. }
        modelOptions: { type: array, items: { type: string }, description: Variant names. }
        variantOptions:
          type: array
          items:
            type: object
            required: [rid, name, size, color]
            properties:
              rid: { type: string }
              name: { type: string }
              size: { type: string, nullable: true }
              color: { type: string, nullable: true }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        descriptionLines: { type: array, items: { type: string } }
        shippingFeeMoney:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        deliveryDays:
          type: object
          nullable: true
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
    ProductVariant:
      type: object
      required: [rid, name, size, color, sku, priceMoney, isDefault, stockQuantity, inStock, handlingDays, deliveryQuote]
      properties:
        rid: { type: string }
        name: { type: string }
        size: { type: string, nullable: true }
        color: { type: string, nullable: true }
        sku: { type: string }
        priceMoney:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: 'Variant override, else product price.'
        priceInclTaxMoney:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
        isDefault: { type: boolean, description: Used when variantId is omitted. }
        stockQuantity: { type: integer, nullable: true, description: 'Null means not tracked (made to order, never sells out).'}
        inStock: { type: boolean }
        handlingDays: { type: integer, description: 'Variant value, else store default.'}
        deliveryQuote:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/DeliveryQuote' }]
    ProductListing:
      type: object
      required: [items, total, page, limit, facets]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ProductCard' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        facets:
          type: object
          required: [brands, colors, screenSizes, attributes, attributeLabels, delivery]
          properties:
            brands: { type: array, items: { type: string } }
            colors: { type: array, items: { type: string } }
            screenSizes: { type: array, items: { type: string } }
            attributes: { type: object, description: Key to value list. }
            attributeLabels: { type: object, description: Key to display label. }
            delivery:
              type: object
              nullable: true
              description: Null without a destination; hide the delivery filter then.
              required: [freeCount, deliveryDays]
              properties:
                freeCount: { type: integer }
                deliveryDays:
                  type: array
                  items: { type: integer }
                  description: Distinct upper delivery-day cut-offs present in this listing; build the maxDeliveryDays filter options from it.
    Review:
      type: object
      required: [rid, author, location, createdAt, rating, text, title]
      properties:
        rid: { type: string }
        author: { type: string }
        location: { type: string }
        createdAt: { type: string, format: date-time }
        rating: { type: integer }
        text: { type: string, nullable: true }
        title: { type: string, nullable: true }
    WaitingReview:
      type: object
      required: [rid, productName, productImage, productImageUrl, orderId, deliveredAt, priceCurrency, priceMoney, quantity]
      properties:
        rid: { type: string, description: Order-line rid; send as reviewId to POST /reviews. }
        productName: { type: string }
        productImage: { type: string }
        productImageUrl: { type: string, nullable: true }
        orderId: { type: string, description: Order reference (fallback rid). }
        deliveredAt: { type: string, format: date-time, nullable: true }
        priceCurrency: { type: string }
        priceMoney: { $ref: '#/components/schemas/Money' }
        quantity: { type: integer }
        product: { $ref: '#/components/schemas/ProductCard' }
    ReviewedReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          required: [status, orderId]
          properties:
            status: { type: string, enum: [published, pending], description: Moderation state; approved reviews publish and move rating counts. }
            orderId: { type: string }
            product: { $ref: '#/components/schemas/ProductCard' }
    CartItem:
      type: object
      required: [rid, name, variant, variantRid, sku, image, imageUrl, currency, price, priceMoney, previousPrice, quantity, stockQuantity, available, selected, productRid]
      properties:
        rid: { type: string }
        name: { type: string }
        variant: { type: string }
        variantRid: { type: string }
        sku: { type: string }
        image: { type: string }
        imageUrl: { type: string, nullable: true }
        currency: { type: string, description: Cart currency; lines never mix currencies. }
        price: { type: number, description: Current unit price in major units; use priceMoney to format. }
        priceMoney: { $ref: '#/components/schemas/Money' }
        previousPrice:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Set when the price moved since the line was added; ordering rejects with price_changed until acknowledged.
        quantity: { type: integer }
        stockQuantity: { type: integer, nullable: true, description: Null means untracked. }
        available: { type: boolean, description: Purchasable and enough stock for the quantity. }
        selected: { type: boolean, description: Only selected lines are ordered and totalled. }
        productRid: { type: string }
    CartSummary:
      type: object
      required: [itemsTotal, itemsDiscount, subtotal, shipping, tax, taxes, total, totalIncludesTax]
      properties:
        itemsTotal:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Pre-sale value (original prices).
        itemsDiscount: { $ref: '#/components/schemas/Money' }
        subtotal:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: What the items actually cost.
        shipping: { $ref: '#/components/schemas/Money' }
        tax:
          type: object
          nullable: true
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Null without a destination; then total excludes tax and totalIncludesTax is false.
        taxes:
          type: array
          items:
            type: object
            required: [name, ratePercent, amount]
            properties:
              name: { type: string }
              ratePercent: { type: number }
              amount: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        totalIncludesTax: { type: boolean }
    Cart:
      type: object
      required: [items, summary]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        summary: { $ref: '#/components/schemas/CartSummary' }
    CheckoutMethod:
      type: object
      required: [rid, code, label, icon, iconUrl]
      properties:
        rid: { type: string }
        code: { type: string, description: 'Stable handle (card, mobile_money, ...); accepted as paymentMethodId.'}
        label: { type: string }
        icon: { type: string, nullable: true, description: Artwork key or image path. }
        iconUrl: { type: string, nullable: true, description: Set only for uploaded/absolute icons; otherwise map the key to brand artwork. }
        currencies: { type: array, items: { type: string }, description: Present on the checkout-methods endpoint; empty scope means everywhere. }
        countries: { type: array, items: { type: string } }
    OrderRecord:
      type: object
      required: [rid, status, paymentStatus, statusDate, placedAt, itemCount, totalMoney, productImages]
      properties:
        rid: { type: string }
        status: { type: string, enum: [pending_payment, processing, shipped, delivered, cancelled], description: Fulfilment state; separate from paymentStatus. }
        paymentStatus: { type: string, enum: [unpaid, paid, failed, refunded] }
        statusDate: { type: string, format: date-time, nullable: true, description: Delivered/shipped/placed date matching the status. }
        placedAt: { type: string, format: date-time, nullable: true }
        itemCount: { type: integer }
        totalMoney: { $ref: '#/components/schemas/Money' }
        productImages: { type: array, items: { type: string } }
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/OrderRecord'
        - type: object
          required: [orderId, orderReference, estimatedDelivery, paymentMethod, currency, items, totals, taxes, address, shipping, returnEligibility, returns, tracking]
          properties:
            orderId: { type: string }
            orderReference: { type: string }
            estimatedDelivery: { $ref: '#/components/schemas/FrozenDeliveryWording' }
            paymentMethod: { type: string, nullable: true, description: Provider that settled the order. }
            currency: { type: string }
            items:
              type: array
              items:
                type: object
                required: [rid, productRid, name, variant, image, imageUrl, quantity, unitPrice, sku, reviewed]
                properties:
                  rid: { type: string, description: Send as reviewId to POST /reviews when unreviewed and delivered. }
                  productRid: { type: string }
                  name: { type: string }
                  variant: { type: string }
                  image: { type: string }
                  imageUrl: { type: string, nullable: true }
                  quantity: { type: integer }
                  unitPrice: { $ref: '#/components/schemas/Money' }
                  sku: { type: string }
                  reviewed: { type: boolean }
            totals:
              type: object
              required: [itemsTotal, itemsDiscount, shipping, tax, total]
              properties:
                itemsTotal: { $ref: '#/components/schemas/Money' }
                itemsDiscount: { $ref: '#/components/schemas/Money' }
                shipping: { $ref: '#/components/schemas/Money' }
                tax: { $ref: '#/components/schemas/Money' }
                total: { $ref: '#/components/schemas/Money' }
            taxes:
              type: array
              items:
                type: object
                required: [name, ratePercent, taxable, amount]
                properties:
                  name: { type: string }
                  ratePercent: { type: number }
                  taxable: { $ref: '#/components/schemas/Money' }
                  amount: { $ref: '#/components/schemas/Money' }
            address: { type: object, description: 'Frozen address snapshot (contact, line1, line2, country, countryCode, names, phone).'}
            shipping: { $ref: '#/components/schemas/OrderShippingSnapshot' }
            returnEligibility:
              type: object
              required: [eligible, reason, windowDays, deadline]
              properties:
                eligible: { type: boolean }
                reason: { type: string, nullable: true }
                windowDays: { type: integer, nullable: true }
                deadline: { type: string, format: date-time, nullable: true }
            returns:
              type: array
              items:
                type: object
                required: [rid, status, reason]
                properties:
                  rid: { type: string }
                  status: { type: string }
                  reason: { type: string, nullable: true }
            tracking:
              type: array
              items: { $ref: '#/components/schemas/TrackingEvent' }
    OrderShippingSnapshot:
      type: object
      description: >-
        Shipping quote frozen onto the order when it was placed. Unlike the
        checkout endpoints this keeps feeMinor (an integer in minor units)
        because it is the settled snapshot, not a display amount.
      required: [feeMinor, deliveryDays, courierLabel]
      properties:
        feeMinor: { type: integer, description: Shipping fee in minor units (2000 = 20.00). }
        deliveryDays:
          type: object
          nullable: true
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        courierLabel: { type: string, nullable: true }
    TrackingEvent:
      type: object
      required: [rid, label, description, occurredAt]
      properties:
        rid: { type: string }
        label: { type: string }
        description: { type: string }
        occurredAt: { type: string, format: date-time, nullable: true }
    SavedPaymentMethod:
      type: object
      required: [rid, cardholderName, type, maskedDetail, network, isDefault]
      properties:
        rid: { type: string }
        cardholderName: { type: string }
        type: { type: string, example: visa }
        maskedDetail: { type: string }
        network: { type: string, nullable: true }
        isDefault: { type: boolean }
    Address:
      type: object
      required: [rid, country, countryCode, firstName, lastName, phoneCountryCode, phoneNumber, addressLine, region, city, isDefault]
      properties:
        rid: { type: string }
        country: { type: string, description: Country name. }
        countryCode: { type: string, description: 'ISO alpha-2; drives tax, shipping, delivery.'}
        countryRid: { type: string }
        regionRid: { type: string, nullable: true }
        cityRid: { type: string, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        phoneCountryCode: { type: string }
        phoneNumber: { type: string }
        addressLine: { type: string }
        region: { type: string }
        city: { type: string }
        cityLine: { type: string, nullable: true }
        isDefault: { type: boolean, description: Drives the destination for signed-in requests. }
    NotificationSetting:
      type: object
      required: [id, title, description, enabled]
      properties:
        id:
          type: string
          enum: [promotions, orderUpdates]
          description: Stable setting key, not a resource identifier.
        title: { type: string }
        description: { type: string }
        enabled: { type: boolean }
x-flows:
  guest-to-first-order:
    - POST /v1/cart/items (collect X-Cart-Id; empty cart adopts product currency)
    - POST /v1/auth/register (send X-Cart-Id; guest lines merge)
    - POST /v1/addresses (set a default address; fixes the destination)
    - POST /v1/orders (Idempotency-Key; totals frozen, stock held; 409 price_changed means show new prices and retry with a new key)
    - POST /v1/checkout/payment-intent (Idempotency-Key; optional paymentMethodId)
    - redirect to checkoutUrl, then GET /v1/payments/{payment} until paid (webhook settles async)
    - There is no account-free checkout: POST /v1/orders requires auth, so a guest cart becomes an order only after register or login. Guests can browse, cart, and quote shipping freely before that.
  failed-payment-retry:
    - POST /v1/checkout/payment-intent again on the same order (still pending_payment, payment failed, not paid). Never create a second order for a retry.
  returns:
    - GET /v1/orders/{order} (read returnEligibility) then POST /v1/orders/{order}/return with reason.
  reviews:
    - GET /v1/reviews/waiting (delivered lines) then POST /v1/reviews with the line rid; published after staff approval.
