      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/addresses:
    get:
      operationId: getAddresses
      tags: [Addresses]
      summary: List addresses
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Addresses, default first then newest.
          content:
            application/json:
              schema:
                type: object
                required: [addresses]
                properties:
                  addresses:
                    type: array
                    items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: postAddresses
      tags: [Addresses]
      summary: Create address
      description: First address (or isDefault true) becomes the default. Country accepts ISO code, rid, or exact name.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [country, firstName, lastName, phoneCountryCode, phoneNumber, addressLine]
              properties:
                country: { type: string, maxLength: 120 }
                regionId: { type: string, description: Region rid; must belong to the country. }
                cityId: { type: string, description: City rid; must belong to the region. }
                firstName: { type: string, maxLength: 120 }
                lastName: { type: string, maxLength: 120 }
                phoneCountryCode: { type: string, maxLength: 16 }
                phoneNumber: { type: string, maxLength: 40 }
                addressLine: { type: string, maxLength: 255 }
                region: { type: string, maxLength: 120, description: Required without regionId; free text stored when no row matches. }
                city: { type: string, maxLength: 120, description: Required without cityId. }
                cityLine: { type: string, maxLength: 120 }
                isDefault: { type: boolean, description: True clears the previous default. }
      responses:
        '201':
          description: Created address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/addresses/lookup/countries:
    get:
      operationId: getAddressesLookupCountries
