            schema:
              type: object
              properties:
                country: { type: string, maxLength: 120 }
                regionId: { type: string }
                cityId: { type: string }
                firstName: { type: string, maxLength: 120 }
                lastName: { type: string, maxLength: 120 }
                phoneCountryCode: { type: string, maxLength: 16 }
                phoneNumber: { type: string, maxLength: 40 }
                addressLine: { type: string, maxLength: 255 }
                region: { type: string, maxLength: 120 }
                city: { type: string, maxLength: 120 }
                cityLine: { type: string, maxLength: 120 }
                isDefault: { type: boolean, description: True clears others; false only unsets this one. }
      responses:
        '200':
          description: Updated address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: address_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAddressesAddress
      tags: [Addresses]
      summary: Delete address
