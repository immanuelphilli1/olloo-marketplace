openapi: 3.0.3
info:
  title: HandCO Storefront API
  version: 1.0.0
  license:
    name: Proprietary
    url: https://handco.example/terms
  description: |
    Machine-readable contract for the HandCO storefront API. This file is the
    source of truth for parameter meanings; docs/API.md is the human companion.

    Conventions:
    * Identifiers. Public resources are addressed by `rid` (an opaque string,
      e.g. `p_abc123`). There is no parallel `id` field anywhere in the API.
      A few `id` fields that are NOT resource identifiers remain and are
      documented as such: `NotificationSetting.id` (enum key
      promotions|orderUpdates), the browsing-history bucket id
      (today|yesterday|older), the mobile-money network id (mtn,
      vodafone_cash, ...), and `facets` keys.
    * Money. Every amount is a `Money` object: `{ amount, currency }` where
      `amount` is in MAJOR units as a JSON number (179 = AED 179.00). Storage
      and provider calls use minor units internally; only the wire format is
      major units. Format client-side, never re-parse the currency string.
    * Dates. All timestamps are ISO 8601 strings; the API sends no
      pre-formatted date or display strings. The client formats money and dates.
    * Errors. The `Error` envelope, except plain framework 404s on inactive
      catalog rows.
servers:
  - url: https://api.handco.example
    description: Configure per environment (VITE_API_BASE_URL).
security: []
tags:
  - name: Auth
    description: Email-first sign-in, registration, password reset, Google OAuth.
  - name: Catalog
    description: Products, categories, product detail, facets, and geo lookups.
  - name: Search
    description: Autocomplete suggestions.
  - name: Cart
    description: Guest or signed-in cart lines, quantities, and selection.
  - name: Checkout
    description: Preview, shipping quote, payment methods, and payment intent.
  - name: Orders
    description: Order placement, list, detail, tracking, and returns.
  - name: Payments
    description: Payment status polling for a placed order.
  - name: Reviews
    description: Product reviews, moderation state, and review eligibility.
  - name: Wishlist
    description: Wishlist lines and their categories.
  - name: Account
    description: Profile, browsing history, newsletter, 2FA, saved payment methods, notifications.
  - name: Addresses
    description: Address book plus country, region, and city lookups.
  - name: Content
    description: Static content pages, home payload, and footer payload.
  - name: Webhooks
    description: Server-to-server provider callbacks. Never called by clients.
paths:
  /v1/auth/check-email:
    post:
      operationId: postAuthCheckEmail
      tags: [Auth]
      summary: Email-first sign-in step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Account email. Existence is disclosed by design (nextStep tells the client which screen to show).
      responses:
        '200':
          description: Next step for this email.
          content:
            application/json:
              schema:
                type: object
                required: [exists, nextStep]
                properties:
                  exists: { type: boolean }
                  nextStep:
                    type: string
                    enum: [register, password, oauth]
                    description: register (new account) | password (login form) | oauth (account has no password, redirect to provider).
                  oauthProvider:
                    type: string
                    example: google
                    description: Present only when nextStep is oauth.
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/auth/register:
    post:
      operationId: postAuthRegister
      tags: [Auth]
      summary: Create account
      description: Merges the guest cart from X-Cart-Id into the new user cart.
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, password_confirmation, fullName]
              properties:
                email: { type: string, format: email, description: Must be unique among live accounts (soft-deleted owners free theirs). }
                password: { type: string, description: Laravel default strength rules. }
                password_confirmation: { type: string, description: Must match password (confirmed rule). }
                fullName: { type: string, maxLength: 120 }
                displayName: { type: string, maxLength: 60, description: Optional short name; defaults to first word of fullName. }
      responses:
        '201':
          description: Account created and logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/auth/login:
    post:
      operationId: postAuthLogin
      tags: [Auth]
      summary: Email and password login
      description: Merges the guest cart from X-Cart-Id into the user cart.
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '422':
          description: Wrong credentials (ValidationException on field email) or bad input.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/oauth/{provider}/url:
    get:
      operationId: getAuthOauthProviderUrl
      tags: [Auth]
      summary: Get provider consent URL
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google] }
          description: Only google is supported.
      responses:
        '200':
          description: Redirect the browser to url; keep state and send it back with the code.
          content:
            application/json:
              schema:
                type: object
                required: [url, state]
                properties:
                  url: { type: string, description: Provider consent URL. }
                  state: { type: string, description: 'Encrypted single-use state, valid 10 minutes.'}
        '422':
          description: unsupported_provider.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/oauth/{provider}:
    post:
      operationId: postAuthOauthProvider
      tags: [Auth]
      summary: Exchange provider code for tokens
      description: Called from the web client callback page with the code and state the provider appended.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google] }
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string, description: Authorization code from the provider. }
                state: { type: string, description: State issued by oauth url endpoint. }
      responses:
        '200':
          description: Logged in (new account created with verified email when needed).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: oauth_failed (bad or expired code).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: oauth_account_conflict (email belongs to another sign-in method).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: unsupported_provider, oauth_invalid_state, or oauth_email_unverified (Google email not verified; user must verify at Google first).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/auth/me:
    get:
      operationId: getAuthMe
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      operationId: postAuthLogout
      tags: [Auth]
      summary: End session
      description: Revokes the current access token only; other sessions stay alive.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Logged out.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      tags: [Auth]
      summary: Refresh access token
      description: Rotates refresh tokens (old refresh revoked, old access tokens deleted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, description: Refresh token from login/register. Single use. }
      responses:
        '200':
          description: Fresh token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthTokens' }
        '401':
          description: Invalid, expired, or revoked refresh token (plain 401, not the error envelope).
          content:
            application/json:
              schema: { type: object }
  /v1/auth/forgot-password:
    post:
      operationId: postAuthForgotPassword
      tags: [Auth]
      summary: Request password reset
      description: Always succeeds (anti-enumeration); email only sent when the address exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: 'If that email exists, a reset link has been sent.'}
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/auth/reset-password:
    post:
      operationId: postAuthResetPassword
      tags: [Auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string, description: Token from the reset email. }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, example: Password has been reset. }
        '422':
          description: reset_failed on bad or expired token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/categories:
    get:
      operationId: getCategories
      tags: [Catalog]
      summary: Full category tree
      parameters:
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Category tree for nav and menus.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CategoryNode' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/categories/{category}:
    get:
      operationId: getCategoriesCategory
      tags: [Catalog]
      summary: Single category
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
          description: Category rid first, then slug.
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Category node (no wrapper).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryNode' }
        '404':
          description: Plain framework 404 (not the error envelope) when missing or inactive.
  /v1/categories/{category}/panel:
    get:
      operationId: getCategoriesCategoryPanel
      tags: [Catalog]
      summary: Category modal panel
      parameters:
        - name: category
          in: path
          required: true
          schema: { type: string }
          description: Category rid first, then slug.
        - $ref: '#/components/parameters/Depth'
      responses:
        '200':
          description: Panel with parent, children, and sections (sections[0] mirrors children).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryPanel' }
        '404':
          description: Plain framework 404 when missing or inactive.
  /v1/products:
    get:
      operationId: getProducts
      tags: [Catalog]
      summary: 'Filtered product listing (canonical search: use q)'
      parameters:
        - $ref: '#/components/parameters/Country'
        - name: categoryId
          in: query
          schema: { type: string }
          description: Slug or rid, or all-categories | featured | new-releases. Parent ids include all descendants.
        - name: subcategory
          in: query
          schema: { type: string }
          description: Legacy alias matching a nested child by label, rid, or slug.
        - name: q
          in: query
          schema: { type: string }
          description: Full-text search over name, brand attribute, and tag names.
        - name: minPrice
          in: query
          schema: { type: number }
          description: Major units, converted to minor (x100) server-side.
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: minRating
          in: query
          schema: { type: number }
          description: Filters on derived rating (approved reviews only).
        - name: freeDelivery
          in: query
          schema: { type: boolean }
          description: Requires a destination; 422 destination_required without one.
        - name: maxDeliveryDays
          in: query
          schema: { type: integer }
          description: Requires a destination; 422 destination_required without one.
        - name: brand
          in: query
          schema: { type: string }
        - name: color
          in: query
          schema: { type: string }
        - name: screenSize
          in: query
          schema: { type: string }
        - name: attributes[key]
          in: query
          schema: { type: string }
          description: Filter any attribute by key, e.g. attributes[material]=Leather.
        - name: sort
          in: query
          schema: { type: string, enum: [price_asc, price_desc, rating, popular, newest, name] }
          description: Aliases accepted (price-low, best_selling, latest, ...). Default with q is popular-then-rating, else newest.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Paginated listing with facets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListing' }
        '422':
          description: country_not_found (bad ?country=) or destination_required.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/products/featured:
    get:
      operationId: getProductsFeatured
      tags: [Catalog]
      summary: Featured items
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Featured items, newest first. No pagination wrapper.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
        '422':
          description: country_not_found (unknown ?country=) or validation_error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorValidation'

  /v1/products/new-arrivals:
    get:
      operationId: getProductsNewArrivals
      tags: [Catalog]
      summary: New arrivals
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: New arrivals, newest first. No pagination wrapper.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
        '422':
          description: country_not_found (unknown ?country=) or validation_error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorValidation'

  /v1/products/recommendations:
    get:
      operationId: getProductsRecommendations
      tags: [Catalog]
      summary: Personalized recommendations
      description: Signed-in shoppers get same-category items excluding recently viewed; guests (or empty history) get featured-by-popular.
      parameters:
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Recommended items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
        '422':
          description: country_not_found (unknown ?country=) or validation_error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorValidation'

  /v1/products/{product}:
    get:
      operationId: getProductsProduct
      tags: [Catalog]
      summary: Product detail
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: string }
          description: Product rid.
        - $ref: '#/components/parameters/Country'
      responses:
        '200':
          description: Detail payload (liked injected when signed in).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '404':
          description: Plain framework 404 when missing or inactive.
  /v1/products/{product}/related:
    get:
      operationId: getProductsProductRelated
      tags: [Catalog]
      summary: Related products
      description: Same category plus sibling categories under the same parent, excluding self, ordered by sold then rating.
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Country'
        - $ref: '#/components/parameters/Limit100'
      responses:
        '200':
          description: Related items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
        '404':
          description: Plain framework 404 when missing or inactive.
  /v1/products/{product}/reviews:
    get:
      operationId: getProductsProductReviews
      tags: [Catalog]
      summary: Approved product reviews
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, default: 10, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Approved reviews, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [reviews, total, page, limit, avgRating]
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  avgRating: { type: number, description: Rounded to 1dp; 0.0 when no reviews. }
        '404':
          description: Plain framework 404 when missing or inactive.
  /v1/search/suggestions:
    get:
      operationId: getSearchSuggestions
      tags: [Search]
      summary: Autocomplete suggestions
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: Matches product name or brand attribute.
        - name: limit
          in: query
          schema: { type: integer, default: 8, minimum: 1, maximum: 20 }
      responses:
        '200':
          description: Suggestions ordered by sold then name.
          content:
            application/json:
              schema:
                type: object
                required: [suggestions]
                properties:
                  suggestions:
                    type: array
                    items:
                      type: object
                      required: [rid, name, image, imageUrl]
                      properties:
                        rid: { type: string }
                        name: { type: string }
                        image: { type: string }
                        imageUrl: { type: string, nullable: true }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/cart:
    get:
      operationId: getCart
      tags: [Cart]
      summary: Get cart and summary
      description: Resolves the user cart when signed in, else the guest cart from X-Cart-Id (creates one when missing). Returns X-Cart-Id header and cart_id cookie.
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Cart with items and totals.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
  /v1/cart/items:
    post:
      operationId: postCartItems
      tags: [Cart]
      summary: Add item
      description: Absent variantId means the default variant. An empty cart adopts the product currency; a cart with lines rejects mismatches (422).
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId: { type: string, description: Product rid (must be active). }
                variantId: { type: string, description: Variant rid of that product; default variant when omitted. }
                quantity: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Updated cart.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: product_not_found or variant_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: invalid_quantity, currency_mismatch, or insufficient_stock (details carry variantRid and available).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorValidation'
                  - $ref: '#/components/schemas/ErrorInvalidQuantity'
                  - $ref: '#/components/schemas/ErrorCurrencyMismatch'
                  - $ref: '#/components/schemas/ErrorInsufficientStock'
    delete:
      operationId: deleteCartItems
      tags: [Cart]
      summary: Remove selected items
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Updated cart.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: validation_error (malformed body).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorValidation' }

  /v1/cart/items/{item}:
    patch:
      operationId: patchCartItemsItem
      tags: [Cart]
      summary: Update quantity or selection
      description: >-
        Quantity 0 deletes the line. At least one of quantity/selected is
        required; sending both applies both. Omitting both fails
        validation_error (422).
      parameters:
        - $ref: '#/components/parameters/CartId'
        - name: item
          in: path
          required: true
          schema: { type: string }
          description: Cart line rid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              anyOf:
                - required: [quantity]
                - required: [selected]
              properties:
                quantity: { type: integer, minimum: 0 }
                selected: { type: boolean }
      responses:
        '200':
          description: Updated cart.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: cart_item_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: validation_error (nothing to update) or insufficient_stock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteCartItemsItem
      tags: [Cart]
      summary: Remove one item
      parameters:
        - $ref: '#/components/parameters/CartId'
        - name: item
          in: path
          required: true
          schema: { type: string }
          description: Cart line rid.
      responses:
        '200':
          description: Updated cart.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '404':
          description: cart_item_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/cart/items/select-all:
    patch:
      operationId: patchCartItemsSelectAll
      tags: [Cart]
      summary: Select or deselect all lines
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selected]
              properties:
                selected: { type: boolean }
      responses:
        '200':
          description: Updated cart.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '422':
          description: validation_error (selected is required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorValidation' }

  /v1/cart/items/move-to-wishlist:
    post:
      operationId: postCartItemsMoveToWishlist
      tags: [Cart]
      summary: Move selected lines to wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Updated cart (moved lines deleted).
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/cart/merge:
    post:
      operationId: postCartMerge
      tags: [Cart]
      summary: Merge guest cart after login
      description: Guest lines fold into the user cart (quantities add up); the guest cart is deleted. No-op without a guest cart.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: User cart.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/checkout/preview:
    get:
      operationId: getCheckoutPreview
      tags: [Checkout]
      summary: Checkout page data
      description: Selected lines only. Address comes from the default saved address when signed in. Shipping uses the destination when known.
      parameters:
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Checkout preview.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [items, address, shipping, paymentMethods, summary]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CartItem' }
                  address:
                    type: object
                    nullable: true
                    required: [contact, line1, line2]
                    properties:
                      contact: { type: string, description: 'Name plus phone, display string.'}
                      line1: { type: string }
                      line2: { type: string }
                  shipping:
                    type: object
                    required: [feeMoney, deliveryDays, courierLabel]
                    properties:
                      feeMoney: { $ref: '#/components/schemas/Money' }
                      deliveryDays:
                        type: object
                        nullable: true
                        required: [min, max]
                        properties:
                          min: { type: integer }
                          max: { type: integer }
                      courierLabel: { type: string, nullable: true }
                  paymentMethods:
                    type: array
                    description: DB methods the cart currency (and destination, when known) can pay with.
                    items: { $ref: '#/components/schemas/CheckoutMethod' }
                  summary: { $ref: '#/components/schemas/CartSummary' }
        '422':
          description: country_not_found (unknown ?country=) or validation_error.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorValidation'

  /v1/checkout/shipping-quote:
    post:
      operationId: postCheckoutShippingQuote
      tags: [Checkout]
      summary: Shipping fee and delivery window
      description: Quote by saved address (auth required) or by a raw address. Includes cart totals with tax.
      parameters:
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                addressRid: { type: string, description: Saved address rid (auth required). }
                country: { type: string, description: 'Required without addressRid (ISO code, rid, or name).'}
                firstName: { type: string }
                lastName: { type: string }
                phoneCountryCode: { type: string }
                phoneNumber: { type: string }
                addressLine: { type: string }
                region: { type: string }
                city: { type: string }
                cityLine: { type: string }
      responses:
        '200':
          description: Quote plus totals.
          content:
            application/json:
              schema:
                type: object
                required: [feeMoney, deliveryDays, courierLabel, summary]
                properties:
                  feeMoney: { $ref: '#/components/schemas/Money' }
                  deliveryDays:
                    type: object
                    nullable: true
                    required: [min, max]
                    properties:
                      min: { type: integer }
                      max: { type: integer }
                  courierLabel: { type: string, nullable: true }
                  summary: { $ref: '#/components/schemas/CartSummary' }
        '401':
          description: unauthenticated (saved address as guest).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: address_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: country_not_found or validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/checkout/payment-intent:
    post:
      operationId: postCheckoutPaymentIntent
      tags: [Checkout]
      summary: Pay an order
      description: Charges exactly the order frozen total through the method or currency provider. Requires Idempotency-Key (missing gives 428; replay returns the first response with Idempotent-Replayed; reused key with different body gives 422 idempotency_key_reused).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string, description: Order rid (must belong to the user). }
                paymentMethodId:
                  type: string
                  description: Optional method rid or code. Unknown gives 404 payment_method_not_found; a method that does not serve the order currency gives 422 payment_method_unavailable. Omitted uses the order currency provider.
      responses:
        '200':
          description: Provider checkout opened. Redirect the shopper to checkoutUrl, then poll GET /payments/{payment} using reference from the return URL.
          content:
            application/json:
              schema:
                type: object
                required: [checkoutUrl, paymentRid, provider, orderId, amount]
                properties:
                  checkoutUrl: { type: string }
                  paymentRid: { type: string }
                  provider: { type: string, example: stripe }
                  paymentMethodId: { type: string, nullable: true, description: Method rid when one was chosen. }
                  orderId: { type: string }
                  amount: { $ref: '#/components/schemas/Money' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: order_not_found or payment_method_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: order_already_paid or order_not_payable (cancelled). A failed payment leaves the order payable; call again to retry.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorOrderAlreadyPaid'
                  - $ref: '#/components/schemas/ErrorOrderNotPayable'
        '422':
          description: validation_error, payment_provider_error, payment_method_unavailable, or idempotency_key_reused.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorValidation'
                  - $ref: '#/components/schemas/ErrorPaymentMethodUnavailable'
                  - $ref: '#/components/schemas/ErrorIdempotencyKeyReused'
        '428':
          description: Missing Idempotency-Key (idempotency_key_required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorIdempotencyKeyRequired' }
  /v1/orders:
    post:
      operationId: postOrders
      tags: [Orders]
      summary: Place order (awaiting payment)
      description: Freezes totals at current prices, holds stock, deletes ordered lines from the cart. Requires Idempotency-Key (same replay rules as payment-intent).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CartId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId, cartItemIds]
              properties:
                addressId: { type: string, description: Saved address rid of the user. }
                cartItemIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                  description: Cart line rids to order. Falls back to selected lines when merge replaced guest rids.
      responses:
        '201':
          description: Order created with status pending_payment.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                required: [orderId, orderReference, estimatedDelivery, status, paymentStatus, totalMoney]
                properties:
                  orderId: { type: string }
                  orderReference: { type: string, example: '#HCO5241124542', description: Display reference. }
                  estimatedDelivery: { $ref: '#/components/schemas/FrozenDeliveryWording' }
                  status: { type: string, example: pending_payment }
                  paymentStatus: { type: string, example: unpaid }
                  totalMoney: { $ref: '#/components/schemas/Money' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: address_not_found or cart_item_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: >-
            price_changed (details.items carry cartItemId, previousPrice,
            price; prices are acknowledged so retry with a new key succeeds),
            insufficient_stock, item_unavailable, currency_mismatch, or
            cart_changed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorPriceChanged'
                  - $ref: '#/components/schemas/ErrorInsufficientStock'
                  - $ref: '#/components/schemas/ErrorItemUnavailable'
                  - $ref: '#/components/schemas/ErrorCurrencyMismatch'
                  - $ref: '#/components/schemas/ErrorCartChanged'
        '422':
          description: validation_error, cart_empty, cart_items_required, or idempotency_key_reused.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Error'
                  - $ref: '#/components/schemas/ErrorValidation'
                  - $ref: '#/components/schemas/ErrorIdempotencyKeyReused'
        '428':
          description: Missing Idempotency-Key (idempotency_key_required).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorIdempotencyKeyRequired' }
    get:
      operationId: getOrders
      tags: [Orders]
      summary: Order list
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, default: all }
          description: all | returns | pending_payment | processing | shipped | delivered | cancelled.
        - name: search
          in: query
          schema: { type: string }
          description: Matches order rid or reference.
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, default: 15, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: User orders, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [orders, total]
                properties:
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/OrderRecord' }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: invalid_status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/orders/buy-again:
    get:
      operationId: getOrdersBuyAgain
      tags: [Orders]
      summary: Buy-again products
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 12, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: Products from past orders.
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/orders/{order}:
    get:
      operationId: getOrdersOrder
      tags: [Orders]
      summary: Order detail
      security: [{ bearerAuth: [] }]
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: string }
          description: Order rid.
      responses:
        '200':
          description: Full order with items, totals, taxes, address, shipping, eligibility, returns, tracking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: order_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/orders/{order}/buy-again:
    post:
      operationId: postOrdersOrderBuyAgain
      tags: [Orders]
      summary: Re-add order items to cart
      description: Same variant when it still exists, else the product default. Skips lines without a product.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CartId'
      responses:
        '200':
          description: Cart with re-added lines.
          headers:
            X-Cart-Id: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: order_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/orders/{order}/return:
    post:
      operationId: postOrdersOrderReturn
      tags: [Orders]
      summary: Request a return
      description: Only after shipping or delivery, for returnable categories inside their window (see returnEligibility in order detail).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Return request opened.
          content:
            application/json:
              schema:
                type: object
                required: [success, returnId, rid, status]
                properties:
                  success: { type: boolean, example: true }
                  returnId: { type: string }
                  rid: { type: string }
                  status: { type: string, example: requested }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: order_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: return_not_allowed (with eligibility details when the window rule blocks) or return_already_open.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorReturnNotAllowed'
                  - $ref: '#/components/schemas/ErrorReturnAlreadyOpen'
  /v1/orders/{order}/tracking:
    get:
      operationId: getOrdersOrderTracking
      tags: [Orders]
      summary: Tracking timeline
      security: [{ bearerAuth: [] }]
      parameters:
        - name: order
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Timeline sorted by occurrence.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/TrackingEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: order_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/payments/{payment}:
    get:
      operationId: getPaymentsPayment
      tags: [Payments]
      summary: Payment status
      description: Poll after the provider redirects back (using reference from the return URL). Never trust redirect params.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: payment
          in: path
          required: true
          schema: { type: string }
          description: Payment rid.
      responses:
        '200':
          description: Payment owned by the user.
          content:
            application/json:
              schema:
                type: object
                required: [rid, provider, status, amount, orderId]
                properties:
                  rid: { type: string }
                  provider: { type: string }
                  status: { type: string, example: pending }
                  amount: { $ref: '#/components/schemas/Money' }
                  orderId: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: payment_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/payment-methods/networks:
    get:
      operationId: getPaymentMethodsNetworks
      tags: [Payments]
      summary: Mobile money networks
      responses:
        '200':
          description: Fixed network list.
          content:
            application/json:
              schema:
                type: object
                required: [networks]
                properties:
                  networks:
                    type: array
                    items:
                      type: object
                      required: [id, label]
                      properties:
                        id: { type: string, example: mtn }
                        label: { type: string, example: MTN }
  /v1/payment-methods/checkout:
    get:
      operationId: getPaymentMethodsCheckout
      tags: [Payments]
      summary: Checkout methods for a currency and destination
      description: Public; for checkout contexts without a cart. Inactive methods never appear.
      parameters:
        - name: currency
          in: query
          schema: { type: string, minLength: 3, maxLength: 3 }
          description: Omitted means all active methods unfiltered.
        - name: country
          in: query
          schema: { type: string }
          description: ISO code, rid, or name; unknown values are ignored (treated as no country).
      responses:
        '200':
          description: Available methods.
          content:
            application/json:
              schema:
                type: object
                required: [paymentMethods]
                properties:
                  paymentMethods:
                    type: array
                    items: { $ref: '#/components/schemas/CheckoutMethod' }
        '422':
          description: validation_error (currency must be 3 characters).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorValidation' }

  /v1/payment-methods:
    get:
      operationId: getPaymentMethods
      tags: [Payments]
      summary: Saved payment methods
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User saved methods.
          content:
            application/json:
              schema:
                type: object
                required: [paymentMethods]
                properties:
                  paymentMethods:
                    type: array
                    items: { $ref: '#/components/schemas/SavedPaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/payment-methods/{paymentMethod}:
    delete:
      operationId: deletePaymentMethodsPaymentMethod
      tags: [Payments]
      summary: Delete saved method
      description: The default passes to the newest remaining method.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: paymentMethod
          in: path
          required: true
          schema: { type: string }
          description: Saved method rid.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: payment_method_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/payment-methods/{paymentMethod}/default:
    patch:
      operationId: patchPaymentMethodsPaymentMethodDefault
      tags: [Payments]
      summary: Set default saved method
      security: [{ bearerAuth: [] }]
      parameters:
        - name: paymentMethod
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated method.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedPaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: payment_method_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/reviews/waiting:
    get:
      operationId: getReviewsWaiting
      tags: [Reviews]
      summary: Order lines awaiting review
      description: Delivered lines without a review.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Waiting items.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WaitingReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/reviews/reviewed:
    get:
      operationId: getReviewsReviewed
      tags: [Reviews]
      summary: Submitted reviews
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: User reviews with moderation status and product cards.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReviewedReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/reviews:
    post:
      operationId: postReviews
      tags: [Reviews]
      summary: Submit a review
      description: One review per order line; published only after staff approval (status pending).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewId, rating]
              properties:
                reviewId: { type: string, description: Waiting order-line rid from reviews/waiting. }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string, maxLength: 160 }
                detailedReview: { type: string, maxLength: 5000, description: Stored as the review body. }
      responses:
        '201':
          description: Review created, pending moderation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewedReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: waiting_review_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: review_exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: product_missing or validation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/wishlist:
    get:
      operationId: getWishlist
      tags: [Wishlist]
      summary: Wishlist products
      security: [{ bearerAuth: [] }]
      parameters:
        - name: category
          in: query
          schema: { type: string }
          description: Category rid or slug filter.
        - name: minRating
          in: query
          schema: { type: number }
      responses:
        '200':
          description: Wishlisted product cards.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/wishlist/categories:
    get:
      operationId: getWishlistCategories
      tags: [Wishlist]
      summary: Wishlist category filter options
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Categories present in the wishlist.
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [rid, slug, label]
                      properties:
                        rid: { type: string }
                        slug: { type: string }
                        label: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/wishlist/{product}:
    post:
      operationId: postWishlistProduct
      tags: [Wishlist]
      summary: Add to wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - name: product
          in: path
          required: true
          schema: { type: string }
          description: Product rid.
      responses:
        '201':
          description: Added (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [success, productRid]
                properties:
                  success: { type: boolean, example: true }
                  productRid: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: product_not_found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteWishlistProduct
      tags: [Wishlist]
      summary: Remove from wishlist
