            application/json:
              schema:
                type: object
                required: [countries]
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      required: [rid, code, name, phoneCode]
                      properties:
                        rid: { type: string }
                        code: { type: string, description: ISO alpha-2. }
                        name: { type: string }
                        phoneCode: { type: string, nullable: true }
  /v1/addresses/lookup/regions:
