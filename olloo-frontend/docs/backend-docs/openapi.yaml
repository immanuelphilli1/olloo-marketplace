  /v1/users/me/2fa/enable:
    post:
      operationId: postUsersMe2faEnable
      tags: [Account]
      summary: Enable two-factor auth
      description: >-
        Generates a TOTP secret (stored encrypted). Show the QR once; it is never
        returned again.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 2FA enabled with provisioning data.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, secret, otpauthUrl]
                properties:
                  enabled: { type: boolean, example: true }
                  secret:
                    type: string
                    description: >-
                      Base32 TOTP seed. Show once to the user; the server never
                      returns it again after this response. Render it into an
                      authenticator app, do not persist it in the client.
                  otpauthUrl:
                    type: string
                    description: otpauth:// provisioning URI. Render this as a QR code yourself; there is no separate image field.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: two_factor_already_enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /v1/users/me/2fa/disable:
    post:
      operationId: postUsersMe2faDisable
      tags: [Account]
      summary: Disable two-factor auth
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: Current password. }
      responses:
        '200':
          description: Disabled.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, success]
                properties:
                  enabled: { type: boolean, example: false }
                  success: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Wrong password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
