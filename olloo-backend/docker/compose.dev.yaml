# Local development. Adds Vite HMR, bind-mounts the repo, and publishes the
# gateway on loopback so a host web server can proxy to it if you prefer.
#
#   ./docker/scripts/dev-up.sh      # or: docker compose -f docker/compose.yaml -f docker/compose.dev.yaml up -d
#   open http://localhost:8021
#
# Storage is still a named volume so uploads and logs survive a rebuild. Delete
# it with docker compose ... down -v if you want a clean slate.

x-dev-build: &dev-build
  context: ..
  dockerfile: docker/Dockerfile
  target: development

x-dev-common: &dev-common
  image: handco-app:dev
  build: *dev-build
  env_file:
    - ./env/app.env
  volumes:
    - ..:/var/www/html
    - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    - storage_data:/var/www/html/storage
  environment:
    APP_ENV: local
    APP_DEBUG: "true"
    LOG_LEVEL: debug
    VITE_HOT_FILE: docker/vite.hot

services:
  app:
    <<: *dev-common
    expose:
      - "9000"

  queue:
    <<: *dev-common
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]
    volumes:
      - ..:/var/www/html
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - storage_data:/var/www/html/storage

  scheduler:
    <<: *dev-common
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ..:/var/www/html
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - storage_data:/var/www/html/storage

  gateway:
    image: handco-gateway:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: gateway-dev
    ports:
      - "127.0.0.1:8030:80"
    volumes:
      - ../public:/var/www/html/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - handco

  vite:
    image: handco-app:dev
    build: *dev-build
    working_dir: /var/www/html
    command: ["sh", "-lc", "npm ci && npm run dev -- --host 0.0.0.0 --port 5174"]
    env_file:
      - ./env/app.env
    environment:
      VITE_HOT_FILE: docker/vite.hot
      VITE_HOST: 0.0.0.0
      VITE_PORT: "5174"
      VITE_HTTPS: "false"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:5174:5174"
    volumes:
      - ..:/var/www/html
      - node_modules_data:/var/www/html/node_modules
    networks:
      - handco
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_started

  # Mail catcher. Start with: --profile mail
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8026:8025"
      - "127.0.0.1:1026:1025"
    networks:
      - handco
    profiles:
      - mail

volumes:
  node_modules_data: