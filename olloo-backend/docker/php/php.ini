; Production PHP settings for the HandCO image.
; Loaded after the extension defaults, so it wins.
;
; These are starting points for a single-app VPS, not measured optima.
;
; Pool settings (pm.max_children, request_terminate_timeout, catch_workers_output)
; are deliberately NOT here. php-fpm reads its pools from
; /usr/local/etc/php-fpm.d/*.conf and ignores a [www] section in a conf.d ini, so
; anything written there looks right and does nothing. The Dockerfile edits
; www.conf instead.

[PHP]
; opcache

; The image has a classmap-authoritative autoloader, so timestamp validation buys
; nothing: nothing changes in the image while it runs. Turning it off removes a
; stat() of every included file per request.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
; Laravel plus this codebase is well past the 10k default.
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
opcache.save_comments = 1
opcache.log_verbosity_level = 1

; Errors and logging

; Never display_errors in production: a stack trace on a storefront is both a
; leak and a broken page.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; Memory and time

memory_limit = 256M
; Long enough for a product import, short enough that a runaway request cannot
; pin a worker forever.
max_execution_time = 120

; Uploads. client_max_body_size in nginx is the outer limit and this is the inner
; one; PHP rejects anything above it silently.
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

expose_php = Off