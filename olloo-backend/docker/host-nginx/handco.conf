# Host nginx for HandCO. This is the public entry point and the only stable
# thing in the request path: the Compose gateway behind it moves on every deploy.
#
#   sudo cp docker/host-nginx/handco.conf /etc/nginx/sites-available/handco
#   sudo ln -s /etc/nginx/sites-available/handco /etc/nginx/sites-enabled/handco
#   sudo nginx -t && sudo systemctl reload nginx
#
# The upstream is included *through* the `current` symlink, so the symlink is the
# cut-over mechanism: docker/scripts/release.sh writes the new release's
# upstream.conf, repoints `current` at it and reloads this server. Do not put a
# server address here directly. A deploy would then have to edit this file, and
# a mistake in it takes the site down instead of failing a release.

upstream handco_app {
    include /var/www/handco/current/upstream.conf;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    # Every name listed here must be covered by the certificate below, or TLS fails
    # for the names that are not. hcomall.com is the API origin and, with the
    # storefront served at /, the shop origin too. The others are accepted so a
    # request arriving under an older name is served rather than falling through to
    # the default server block.
    server_name hcomall.com handco.craftsmanjohn.com www.handco.craftsmanjohn.com;

    # Cloudflare terminates TLS and talks to this origin over HTTP. Redirect to
    # HTTPS here rather than relying on Cloudflare's "Always Use HTTPS", so a
    # direct request to the origin still lands correctly.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Every name listed here must be covered by the certificate below, or TLS fails
    # for the names that are not. hcomall.com is the API origin and, with the
    # storefront served at /, the shop origin too. The others are accepted so a
    # request arriving under an older name is served rather than falling through to
    # the default server block.
    server_name hcomall.com handco.craftsmanjohn.com www.handco.craftsmanjohn.com;

    # Must cover every name in server_name above.
    ssl_certificate     /etc/letsencrypt/live/hcomall.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hcomall.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Product imports are CSV uploads.
    client_max_body_size 64M;

    # Cloudflare's real visitor address, restored from the left-most CF header so
    # PHP and the container see a real client IP. ShopperLocale detects the
    # shopper's country from it, so getting this wrong places every visitor in
    # the same country.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    access_log /var/log/nginx/handco.access.log;
    error_log  /var/log/nginx/handco.error.log;

    location / {
        proxy_pass http://handco_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # Payment provider returns and webhook deliveries, both of which must not
        # be buffered behind a slow client.
        proxy_buffering off;
    }
}