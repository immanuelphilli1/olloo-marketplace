server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Product imports are CSV uploads and the admin portal posts media.
    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    # The peer is the host reverse proxy (Apache or nginx on the Docker host),
    # not Cloudflare itself. Trust the private ranges it arrives from and
    # restore the visitor from CF-Connecting-IP so PHP sees a real address:
    # ShopperLocale detects the country from it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Uploaded images, from the shared storage volume. See spa.conf.template.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Built assets are fingerprinted by Vite, so they can be cached hard and
    # skipped on revalidation. index.php must never be.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # After real_ip, $remote_addr is the visitor. Give PHP a clean XFF so
        # TRUSTED_PROXIES matches one address instead of a chain.
        # REMOTE_ADDR is the real peer (the host proxy, via the Docker bridge),
        # not the visitor real_ip resolved. Laravel trusts X-Forwarded-* only
        # from TRUSTED_PROXIES; with the visitor as REMOTE_ADDR it ignored
        # X-Forwarded-Proto and built http:// admin asset URLs (blocked as mixed
        # content) as soon as the host proxy sent CF-Connecting-IP. The visitor
        # goes in X-Forwarded-For, which Laravel reads once it trusts the peer.
        fastcgi_param REMOTE_ADDR $realip_remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_pass app:9000;
        # Payment provider returns and webhook posts are all short, but a cold
        # opcache after a deploy makes the first request slow.
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Keep PHP out of any other .php file that might land in public/.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}