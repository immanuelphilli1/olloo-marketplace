# Host Apache for HandCO. The public entry point, and the only stable thing in the
# request path: the Compose gateway behind it moves on every deploy.
#
#   sudo cp docker/host-apache/handco.conf /etc/apache2/sites-available/handco.conf
#   sudo a2ensite handco.conf && sudo a2dissite 000-default
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# THE UPSTREAM IS INCLUDED *THROUGH* THE `current` SYMLINK, so the symlink is the
# cut-over mechanism, exactly as it is for nginx. docker/scripts/release.sh writes
# the new release's proxy.conf, repoints `current` at it and reloads Apache. Do not
# put a server address in this file. A deploy would then have to edit it, and a
# mistake in it takes the site down instead of failing a release.
#
# Apache reads Include through a symlink, which is what makes this work, and it is
# the thing that would otherwise have ruled Apache out. Rehearsed: repointing that
# symlink and running `apache2ctl -k graceful` moved the live upstream to the other
# colour, and repointing it back rolled it back, with no dropped connection either
# time. release.sh writes proxy.conf for Apache and upstream.conf for nginx because
# the two formats cannot be parsed by the other server.
#
# `graceful` rather than `restart`: it re-reads the config and starts new workers,
# while in-flight requests finish on the old ones. A restart would refuse
# connections during the gap, which is the downtime this whole design avoids.
#
# No session cache here. Apache rejects SSLSessionCache inside <VirtualHost>
# outright, and SSLSessionCacheTimeout is server-config only too, so neither can be
# set per-vhost without moving them into the server config. The distro defaults from
# ssl.conf are used. Both mistakes were caught by running `apache2ctl -t` against
# this file rather than by reading it: the first is "cannot occur within
# <VirtualHost>", the second is "Invalid command 'SSLSessionTimeout'", which is not
# an Apache directive at all.

# Cloudflare's real visitor address, restored from the left-most CF header so PHP
# and the container see a real client IP. ShopperLocale detects the shopper's
# country from it, so getting this wrong places every visitor in the same country.
#
# Verified: production is NOT currently behind Cloudflare (no cf-ray in the
# response, and the certificate on handco.craftsmanjohn.com is a plain Let's
# Encrypt one). These ranges are kept so adding Cloudflare later needs no change
# here, and so a direct request still gets a correct address. RemoteIPTrustedProxy
# lists only Cloudflare, so a direct client is left alone rather than trusted.
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 173.245.48.0/20
RemoteIPTrustedProxy 103.21.244.0/22
RemoteIPTrustedProxy 103.22.200.0/22
RemoteIPTrustedProxy 103.31.4.0/22
RemoteIPTrustedProxy 141.101.64.0/18
RemoteIPTrustedProxy 108.162.192.0/18
RemoteIPTrustedProxy 190.93.240.0/20
RemoteIPTrustedProxy 188.114.96.0/20
RemoteIPTrustedProxy 197.234.240.0/22
RemoteIPTrustedProxy 198.41.128.0/17
RemoteIPTrustedProxy 162.158.0.0/15
RemoteIPTrustedProxy 104.16.0.0/13
RemoteIPTrustedProxy 104.24.0.0/14

# Product imports are CSV uploads.
LimitRequestBody 67108864

<VirtualHost *:80>
    ServerName hcomall.com
    ServerAlias handco.craftsmanjohn.com www.handco.craftsmanjohn.com

    # ACME challenges must answer on plain HTTP for certbot to renew, so they are
    # served from disk before anything else is considered. This is the one path
    # that does not reach the app.
    Alias /.well-known/acme-challenge/ /var/www/certbot/
    <Directory /var/www/certbot/>
        Require all granted
        Options None
        AllowOverride None
    </Directory>

    # mod_rewrite rather than `Redirect permanent /`. Both are handled by
    # mod_alias, and Redirect wins over Alias in the URL fixup order, so a plain
    # Redirect sends the ACME challenge to https too and certbot cannot renew.
    # Verified: with Redirect, the challenge answered 404 from the gateway; with
    # this, it is served from disk.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName hcomall.com
    ServerAlias handco.craftsmanjohn.com www.handco.craftsmanjohn.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/hcomall.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/hcomall.com/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    # The gateway. Written by release.sh, reached through the `current` symlink.
    # proxy.conf, not upstream.conf: this is Apache's own format. release.sh
    # writes both, one per server, because they are not interchangeable.
    Include /var/www/handco/current/proxy.conf

    # A client's own X-Forwarded-For is dropped, so the one mod_proxy adds holds
    # exactly the shopper's address. The storefront SSR server forwards it to the
    # API (through the internal listener below) to price in the shopper's currency.
    RequestHeader unset X-Forwarded-For early

    # The gateway takes the client address from CF-Connecting-IP and nothing else.
    # Production is not behind Cloudflare, so without this the header is absent and
    # PHP sees this proxy's Docker bridge address for every visitor: IP country
    # detection never runs (GET /locale answered countrySource "default"). Set it
    # from the real client (mod_remoteip has already resolved Cloudflare if it is
    # ever in front), which also stops a client from spoofing the header.
    #
    # REQUIRES a gateway that passes REMOTE_ADDR as $realip_remote_addr (the API
    # release after 2026-10-11). An older gateway hands PHP the visitor as
    # REMOTE_ADDR, Laravel stops trusting X-Forwarded-Proto, and the admin's
    # assets load over http:// and are blocked. Enable this line only after that
    # API release is live.
    RequestHeader set CF-Connecting-IP "expr=%{REMOTE_ADDR}"

    # Laravel builds absolute URLs from these, and the guest cart cookie's
    # SameSite and Secure attributes come from the scheme. Getting the proto wrong
    # silently drops the Secure flag and breaks the post-payment bounce.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Webhook posts and provider returns are short, but a cold opcache after a
    # deploy makes the first one slow.
    ProxyTimeout 120

    ErrorLog  ${APACHE_LOG_DIR}/handco-error.log
    CustomLog ${APACHE_LOG_DIR}/handco-access.log combined
</VirtualHost>

# Internal API listener for the storefront SSR server (server/ssr.mjs), which runs
# on the host network and renders /products/* (proxy.conf sends them there).
# Loopback only, /api/ only. It reaches the live gateway through the same
# `current` proxy.conf, so it follows the blue/green switch with no edit.
#
# The SSR server forwards the shopper's address in X-Forwarded-For. The gateway
# takes the client address from CF-Connecting-IP (it trusts private and loopback
# peers), so copy it across; without this every SSR page is priced for the
# server's own country. Needs mod_headers.
Listen 127.0.0.1:8039
<VirtualHost 127.0.0.1:8039>
    ServerName handco-internal-api

    <Location "/">
        Require all denied
    </Location>
    <Location "/api/">
        Require all granted
    </Location>

    Include /var/www/handco/current/proxy.conf

    ProxyPreserveHost On
    RequestHeader set Host "hcomall.com"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set CF-Connecting-IP "expr=%{req:X-Forwarded-For}"
    ProxyTimeout 15

    ErrorLog  ${APACHE_LOG_DIR}/handco-internal-error.log
    CustomLog ${APACHE_LOG_DIR}/handco-internal-access.log combined
</VirtualHost>
